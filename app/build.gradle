plugins {
    id 'com.android.application'
}

android {
    namespace 'id.rkdesain.koreamaster'
    compileSdk 35

    defaultConfig {
        applicationId 'id.rkdesain.koreamaster'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
