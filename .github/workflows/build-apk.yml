name: Build Korea Master APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: korea-master-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 does not request Google's removed SDK "tools" package.
      # v3 requested it and failed with: Failed to find package 'tools'.
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Siapkan Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pasang Android SDK yang dibutuhkan
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Periksa struktur proyek
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/id/rkdesain/koreamaster/MainActivity.java
          test -f app/src/main/assets/index.html
          echo "Struktur proyek lengkap."
          echo "Gradle: $(gradle --version | grep -m1 '^Gradle ')"
          echo "Java: $(java -version 2>&1 | head -n 1)"

      - name: Bangun APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoreaMaster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
